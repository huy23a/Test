<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09070f"><meta name="description" content="Nova AI - Trợ lý trí tuệ nhân tạo."><title>Nova AI</title><style>:root{color-scheme:dark;--bg:#09070f;--panel:#100d19;--panel-hover:#1b1428;--border:#292039;--purple:#8b5cf6;--text:#f5f3ff;--muted:#a49ab8}*{box-sizing:border-box}body{margin:0;height:100dvh;overflow:hidden;background:var(--bg);color:var(--text);font:15px/1.65 system-ui,sans-serif}button,textarea{font:inherit}button{color:inherit;cursor:pointer}svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}button:focus-visible,textarea:focus-visible{outline:2px solid #a78bfa;outline-offset:3px}.app{height:100dvh;display:flex}.sidebar{width:245px;flex-shrink:0;padding:22px 14px;background:#0d0a14;border-right:1px solid var(--border);display:flex;flex-direction:column;gap:24px}.brand{display:flex;align-items:center;gap:11px;padding:0 6px}.logo{width:41px;height:41px;display:grid;place-items:center;border-radius:13px;background:linear-gradient(135deg,#a78bfa,#6d28d9)}.logo svg{width:25px;height:25px}.brand-name{font-size:20px;font-weight:800;letter-spacing:-.6px}.brand-caption{font-size:10px;color:var(--muted);letter-spacing:1.5px}.side-button{width:100%;display:flex;align-items:center;justify-content:center;gap:9px;padding:12px;border:1px solid var(--border);border-radius:12px;background:var(--panel);transition:background .2s}.side-button:hover{background:var(--panel-hover)}.side-note{margin-top:auto;padding:13px;border:1px solid var(--border);border-radius:12px;color:var(--muted);font-size:12px}.side-note strong{display:block;color:#d9caff;margin-bottom:4px}.main{flex:1;min-width:0;display:flex;flex-direction:column}.topbar{min-height:68px;padding:12px 24px;border-bottom:1px solid #211a2c;display:flex;align-items:center;justify-content:space-between;gap:12px}.top-title{font-weight:700}.top-subtitle{color:var(--muted);font-size:12px}.top-actions{display:flex;align-items:center;gap:12px}.status{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px}.status-dot{width:7px;height:7px;border-radius:50%;background:#a78bfa}.icon-button{width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--border);border-radius:11px;background:transparent}.icon-button:hover{background:var(--panel-hover)}.chat-scroll{flex:1;overflow-y:auto;padding:28px 20px;scroll-behavior:smooth}.chat-inner{width:100%;max-width:790px;margin:0 auto}.welcome{min-height:55vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px 0 50px}.hero-icon{width:66px;height:66px;display:grid;place-items:center;border:1px solid #54377a;border-radius:21px;background:linear-gradient(140deg,#2c1b49,#171027);color:#c4b5fd;margin-bottom:22px}.hero-icon svg{width:33px;height:33px}h1{margin:0;font-size:clamp(28px,5vw,40px);letter-spacing:-1px;line-height:1.25}.gradient{color:#b69aff}.welcome p{margin:12px 0 0;color:var(--muted)}.messages{display:flex;flex-direction:column;gap:26px}.message{display:flex;align-items:flex-start;gap:12px;min-width:0}.message.user{flex-direction:row-reverse}.avatar{width:34px;height:34px;flex-shrink:0;display:grid;place-items:center;border:1px solid #38264f;border-radius:11px;background:#211631;color:#c4b5fd}.avatar svg{width:18px;height:18px}.message.user .avatar{background:#38205c;color:white}.message-body{min-width:0;max-width:calc(100% - 46px)}.message-label{margin-bottom:5px;color:var(--muted);font-size:12px}.bubble{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.8}.message.user .bubble{padding:10px 15px;border:1px solid #392850;border-radius:15px 5px 15px 15px;background:#211832}.composer-area{padding:12px 20px 17px;background:var(--bg)}.composer{max-width:790px;margin:0 auto}.input-box{display:flex;align-items:flex-end;gap:10px;padding:10px 11px;border:1px solid #38284b;border-radius:17px;background:#14101d;transition:border-color .2s}.input-box:focus-within{border-color:#7951b9}textarea{flex:1;min-width:0;max-height:160px;resize:none;border:0;outline:none;background:transparent;color:var(--text);padding:8px 4px;line-height:1.5}textarea::placeholder{color:#80748f}.send-button{width:42px;height:42px;flex-shrink:0;display:grid;place-items:center;border:1px solid #9466ef;border-radius:12px;background:linear-gradient(135deg,#8b5cf6,#6d28d9)}.send-button:hover{filter:brightness(1.15)}.send-button:disabled{opacity:.5;cursor:not-allowed}.disclaimer{margin-top:9px;color:#766c83;font-size:11px;text-align:center}.typing{display:flex;gap:5px;padding:8px 0}.typing i{width:6px;height:6px;border-radius:50%;background:#b8a1ee;animation:pulse .8s infinite alternate}.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}@keyframes pulse{to{opacity:.25;transform:translateY(-3px)}}@media(max-width:650px){.sidebar{display:none}.topbar{min-height:61px;padding:10px 14px}.chat-scroll{padding:20px 15px}.welcome{min-height:52vh}.composer-area{padding:10px 12px 12px}}</style></head><body><div class="app"><aside class="sidebar"><div class="brand"><div class="logo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 2.8 7.2L22 12l-7.2 2.8L12 22l-2.8-7.2L2 12l7.2-2.8z"/><path d="M19 2v5m-2.5-2.5h5"/></svg></div><div><div class="brand-name">Nova AI</div><div class="brand-caption">AI ASSISTANT</div></div></div><button class="side-button" id="newChat"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Cuộc trò chuyện mới</button><div class="side-note"><strong>Nova AI</strong>Trợ lý AI hỗ trợ học tập, sáng tạo và công việc.</div></aside><main class="main"><header class="topbar"><div><div class="top-title">Nova AI <span class="gradient">✦</span></div><div class="top-subtitle">Trợ lý trí tuệ nhân tạo</div></div><div class="top-actions"><div class="status"><span class="status-dot"></span><span id="statusText">Sẵn sàng</span></div><button class="icon-button" id="clearChat" title="Cuộc trò chuyện mới" aria-label="Cuộc trò chuyện mới"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></div></header><section class="chat-scroll" id="chatScroll"><div class="chat-inner"><div class="welcome" id="welcome"><div class="hero-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 2.8 7.2L22 12l-7.2 2.8L12 22l-2.8-7.2L2 12l7.2-2.8z"/><path d="M19 2v5m-2.5-2.5h5"/></svg></div><h1>Nova <span class="gradient">AI</span></h1><p>Trợ lý AI cho mọi ý tưởng.</p></div><div class="messages" id="messages" aria-live="polite"></div></div></section><div class="composer-area"><div class="composer"><form class="input-box" id="chatForm"><textarea id="prompt" rows="1" maxlength="6000" placeholder="Nhập tin nhắn..." aria-label="Nhập tin nhắn"></textarea><button class="send-button" id="sendBtn" type="submit" aria-label="Gửi tin nhắn"><svg viewBox="0 0 24 24"><path d="M12 19V5m-7 7 7-7 7 7"/></svg></button></form><div class="disclaimer">AI có thể mắc lỗi. Hãy kiểm tra thông tin quan trọng.</div></div></div></main></div><script>const API_URL="https://chat.huy01812as.workers.dev/chat";const form=document.getElementById("chatForm");const input=document.getElementById("prompt");const sendBtn=document.getElementById("sendBtn");const messagesEl=document.getElementById("messages");const welcome=document.getElementById("welcome");const chatScroll=document.getElementById("chatScroll");const statusText=document.getElementById("statusText");let history=[];let busy=false;const botIcon=`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v3m-4 0h8a4 4 0 0 1 4 4v6a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4v-6a4 4 0 0 1 4-4Z"/><path d="M9 12h.01M15 12h.01M9 16h6"/></svg>`;const userIcon=`<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>`;function scrollBottom(){chatScroll.scrollTop=chatScroll.scrollHeight}function addMessage(role,content){welcome.classList.add("hidden");const row=document.createElement("article");row.className="message "+role;const avatar=document.createElement("div");avatar.className="avatar";avatar.innerHTML=role==="user"?userIcon:botIcon;const body=document.createElement("div");body.className="message-body";const label=document.createElement("div");label.className="message-label";label.textContent=role==="user"?"Bạn":"Nova AI";const bubble=document.createElement("div");bubble.className="bubble";bubble.textContent=content;body.append(label,bubble);row.append(avatar,body);messagesEl.appendChild(row);scrollBottom();return bubble}function setBusy(value){busy=value;sendBtn.disabled=value;statusText.textContent=value?"Đang xử lý...":"Sẵn sàng"}async function sendMessage(text){text=text.trim();if(!text||busy)return;addMessage("user",text);history.push({role:"user",content:text});input.value="";input.style.height="auto";setBusy(true);const bubble=addMessage("assistant","");bubble.innerHTML='<div class="typing" aria-label="Đang trả lời"><i></i><i></i><i></i></div>';try{const response=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:history.slice(-20)})});let data;try{data=await response.json()}catch{throw new Error("Phản hồi từ Worker không hợp lệ (HTTP "+response.status+").")}if(!response.ok)throw new Error(data.error||"HTTP "+response.status);if(typeof data.reply!=="string")throw new Error("Phản hồi chưa có nội dung reply.");bubble.textContent=data.reply;history.push({role:"assistant",content:data.reply})}catch(error){history.pop();bubble.textContent="Không thể kết nối AI: "+error.message+"\n\nNếu lỗi CORS hoặc 403, hãy kiểm tra ALLOWED_ORIGIN trong Cloudflare Worker."}finally{setBusy(false);scrollBottom()}}form.addEventListener("submit",event=>{event.preventDefault();sendMessage(input.value)});input.addEventListener("input",()=>{input.style.height="auto";input.style.height=Math.min(input.scrollHeight,160)+"px"});input.addEventListener("keydown",event=>{if(event.key==="Enter"&&!event.shiftKey){event.preventDefault();form.requestSubmit()}});function resetChat(){if(busy)return;history=[];messagesEl.replaceChildren();welcome.classList.remove("hidden");input.value="";input.style.height="auto";input.focus()}document.getElementById("newChat").addEventListener("click",resetChat);document.getElementById("clearChat").addEventListener("click",resetChat);</script></body></html>
